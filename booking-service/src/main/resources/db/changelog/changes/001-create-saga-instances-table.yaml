databaseChangeLog:
  - changeSet:
      id: 001-create-saga-instances-table
      author: rzodeczko
      changes:
        - createTable:
            tableName: saga_instances
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: customer_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: destination
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME(6)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
        # Indexes are declared with every column the query sorts by (including id), so they work the same way
        # on any database. InnoDB would append the primary key to a secondary index on its own; PostgreSQL would not.
        # GET /bookings: ORDER BY created_at, id (keyset-friendly, index-only scan of ids)
        - createIndex:
            tableName: saga_instances
            indexName: idx_saga_instances_created_at_id
            columns:
              - column:
                  name: created_at
              - column:
                  name: id
        # GET /bookings/stuck: WHERE status IN (...) AND updated_at < ? ORDER BY updated_at, id
        # status first: only the few active sagas are scanned, not the ever-growing terminal ones
        - createIndex:
            tableName: saga_instances
            indexName: idx_saga_instances_status_updated_at_id
            columns:
              - column:
                  name: status
              - column:
                  name: updated_at
              - column:
                  name: id
